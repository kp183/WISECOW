name: ci

on:
  push:
    branches: [main]

env:
  IMAGE: kp183/wisecow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: patch image tag
        run: |
          sed -i "s|image: .*/wisecow:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" k8s/deployment.yaml

      - name: apply manifests
        run: kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/ingress.yaml

      - name: wait for rollout
        run: kubectl rollout status deployment/wisecow --timeout=120s
